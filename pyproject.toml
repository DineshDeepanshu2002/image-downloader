[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-downloader"
version = "1.0.0"
description = "Download images listed in a plaintext URL file to the local disk."
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
image-downloader = "image_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["image_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["image_downloader"]

[tool.coverage.run]
omit = ["image_downloader/__main__.py"]
